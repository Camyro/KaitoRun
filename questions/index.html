<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Pack Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Personagem original -->
<div class="student-container"><div class="student"></div></div>

<div class="app">
  <!-- HEADER -->
  <header class="header">
    <button class="btn-hamburger" onclick="toggleSidebar()">☰</button>
    <button class="btn btn-sm" onclick="goBackFolder()">Voltar</button>
    <div class="header-logo">Questions</div>
    <div class="header-sub">Manager</div>
  </header>

  <!-- SIDEBAR BACKDROP -->
  <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-head">
      <span class="sidebar-title">PACKS</span>
      <div style="display:flex;gap:5px;">
        <button class="btn btn-sm" style="background:#e8e8e0;color:#111;" onclick="openAiModal()">
          <img src="../midia/caosb.png" alt="IA Icon" style="width:16px;vertical-align:middle;margin-right:4px;">
          AI CAOS</button>
        <button class="btn btn-primary btn-sm" onclick="openNewPackModal()">+ Novo</button>
      </div>
    </div>

    <!-- 👇 ISSO ESTAVA FALTANDO -->
    <div id="packList" class="pack-list"></div>
  </div>

  <!-- MAIN -->
  <main class="main" id="mainPanel">
    <div class="empty-state" id="emptyState">
      <div class="empty-state-icon">📦</div>
      <p>Selecione ou crie um pack de perguntas para jogar com elas</p>
    </div>
    <div class="pack-detail" id="packDetail" style="display:none;"></div>
  </main>
</div>

<!-- QUESTION MODAL -->
<div class="modal-overlay" id="questionModal">
  <div class="modal">
    <div class="modal-title">
      <span id="modalTitle">Nova Pergunta</span>
      <button class="btn btn-icon" onclick="closeModal()">✕</button>
    </div>
    <div class="form-group">
      <label class="form-label">Pergunta</label>
      <input type="text" class="form-input" id="qText" placeholder="Digite a pergunta..." />
    </div>
    <div class="form-group">
      <label class="form-label">Opções — selecione a correta</label>
      <div class="options-grid">
        <div class="option-row"><span class="option-letter">A</span><input type="radio" name="correct" value="0" class="option-radio" /><input type="text" class="form-input" id="opt0" placeholder="Opção A" /></div>
        <div class="option-row"><span class="option-letter">B</span><input type="radio" name="correct" value="1" class="option-radio" /><input type="text" class="form-input" id="opt1" placeholder="Opção B" /></div>
        <div class="option-row"><span class="option-letter">C</span><input type="radio" name="correct" value="2" class="option-radio" /><input type="text" class="form-input" id="opt2" placeholder="Opção C" /></div>
        <div class="option-row"><span class="option-letter">D</span><input type="radio" name="correct" value="3" class="option-radio" /><input type="text" class="form-input" id="opt3" placeholder="Opção D" /></div>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Tempo Limite (segundos)</label>
      <input type="number" class="form-input" id="qTime" value="10" min="3" max="120" />
    </div>

    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveQuestion()">Salvar</button>
    </div>
  </div>
</div>

<!-- CONFIRM -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <div class="confirm-title" id="confirmTitle">Confirmar</div>
    <div class="confirm-msg" id="confirmMsg"></div>
    <div class="confirm-footer">
      <button class="btn" onclick="closeConfirm()">Cancelar</button>
      <button class="btn btn-danger" id="confirmOkBtn">Excluir</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast-container" id="toastContainer"></div>

<!-- AI GENERATE MODAL -->
<div class="ai-modal-overlay" id="aiModal">
  <div class="ai-modal">
    <div class="modal-title">
      <span>Caos AI Generate</span>
      <button class="btn btn-icon" onclick="closeAiModal()">✕</button>
    </div>

    <div class="form-group">
      <label class="form-label">Mande um tema ou lista de perguntas</label>
      <textarea class="ai-generate-input" id="aiInput"
        placeholder="Ex: 10 questões de matemática&#10;Ex: Qual o nome da capital do Brasil? R: Brasília"></textarea>
    </div>

    <div class="form-group">
      <label class="form-label">Uso diário</label>
      <div class="ai-limit-bar-wrap">
        <div class="ai-limit-bar-bg">
          <div class="ai-limit-bar-fill" id="aiLimitFill" style="width:0%"></div>
        </div>
        <span class="ai-limit-label" id="aiLimitLabel">0 / 10 hoje</span>
      </div>
    </div>

    <div class="ai-loading-indicator" id="aiLoading">⏳ Gerando questões...</div>

    <p>Obs: O Caos IA pode cometer erros verifique as respostas geradas.</p>

    <div class="modal-footer">
      <button class="btn" onclick="closeAiModal()">Cancelar</button>
      <button class="btn btn-sm" style="background:#111;color:#e8e8e0;" id="aiGenerateBtn" onclick="runAiGenerate()">
        <img src="../midia/caosw.png" alt="IA Icon" style="width:16px;vertical-align:middle;margin-right:4px;">
        Gerar</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
