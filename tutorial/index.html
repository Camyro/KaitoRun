<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tutorial</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="buildings-medium"></div>
  <div id="buildings-near"></div>
  <div id="world"></div>
  <div class="student-container">
    <div class="student"></div>
  </div>
  <div id="tutorial-wrap">
    <div id="tutorial-box">

      <div id="tutorial-title">Tutorial</div>

      <div class="tip">
        <div class="tip-text">
          <strong>PULE</strong> ao ver obstáculos:<br>
          pedras, rachaduras, arbustos e lamas.<br>
          Colidir = <strong>game over instantâneo.</strong>
        </div>
      </div>

      <div class="divider"></div>

      <div class="tip">
        <div class="tip-text">
          <span class="ok">NÃO PULE</span> as interrogações (são perguntas).<br>
          Errar uma pergunta faz você perder um ❤️.
        </div>
      </div>

      <div class="divider"></div>

      <div class="tip">
        <div class="tip-text">
          Perca <strong>3 corações</strong> e o jogo acaba.
        </div>
      </div>

      <a href="../theBeginning/" class="btn-start">▶ START</a>

    </div>
  </div>

</body>
</html>
